name: Deploy CityLab Security

# Aciona o workflow apenas quando houver push na branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, ARM64]  # Isso diz para rodar no Raspberry Pi, não na nuvem do GitHub
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      run : |
        python3.13 -m venv .venv
        echo "$PWD/.venv/bin" >> $GITHUB_PATH"

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
    
    - name: Sync files to Production Folder
      run: |
        rsync -av --exclude='citylab_venv' --exclude='.git' $GITHUB_WORKSPACE/ /home/citylab/Desktop/Projects/CityLab_Security/

    # - name: Restart Application
    #   run: |
    #     sudo systemctl restart citylab.service