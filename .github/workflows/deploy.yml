name: Deploy CityLab Security

# Aciona o workflow apenas quando houver push na branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, ARM64]  # Runner local no Raspberry Pi
    env:
      DEPLOY_DIR: /home/citylab/CityLab_Security

    steps:
    # A API roda como servico do usuario citylab, o mesmo do runner
    # (tools/instalar_servico_rpi.sh). Com 1 GB de RAM, a instalacao de
    # dependencias nao cabe junto com ela.
    - name: Stop API service
      run: |
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        if systemctl --user cat citylab-api.service >/dev/null 2>&1; then
          systemctl --user stop citylab-api.service
        else
          echo "Servico citylab-api nao instalado: pare a API a mao antes do push."
        fi

    - name: Check out repository
      uses: actions/checkout@v4

    - name: Sync files to Production Folder
      run: |
        test -d "$DEPLOY_DIR"
        rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              "$GITHUB_WORKSPACE/" \
              "$DEPLOY_DIR/"

    # No .venv da propria API, so quando o requirements muda e com --no-deps.
    # Se a API deixar de importar, o script volta as versoes de antes e o passo
    # falha; o servico sobe no passo seguinte de qualquer jeito.
    - name: Install Dependencies
      run: |
        cd "$DEPLOY_DIR"
        bash tools/atualizar_dependencias_rpi.sh

    # Sobe mesmo se um passo anterior falhar: o sistema nao pode ficar sem API.
    - name: Start API service
      if: always()
      run: |
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        if systemctl --user cat citylab-api.service >/dev/null 2>&1; then
          systemctl --user start citylab-api.service
          systemctl --user --no-pager --lines=0 status citylab-api.service
        fi
