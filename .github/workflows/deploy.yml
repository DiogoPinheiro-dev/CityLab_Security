name: Deploy CityLab Security

# Aciona o workflow apenas quando houver push na branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, ARM64]  # Isso diz para rodar no Raspberry Pi, não na nuvem do GitHub
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Sync files to Production Folder
      run: |
        rsync -av \
              --exclude='citylab_venv' \
              --exclude='.git' \
              --exclude='.github' \
              "$GITHUB_WORKSPACE/" \
              /home/citylab/Desktop/Projects/CityLab_Security/

    - name: Install Dependencies
      run: |
        cd /home/citylab/Desktop/Projects/CityLab_Security
        
        python3.13 -m venv citylab_venv 
        
        source citylab_venv/bin/activate
        
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

    # - name: Restart Application
    #   run: |
    #     sudo systemctl restart citylab.service