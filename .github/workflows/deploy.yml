name: Deploy CityLab Security

# Aciona o workflow apenas quando houver push na branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, ARM64]  # Runner local no Raspberry Pi

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Sync files to Production Folder
      run: |
        rsync -av \
              --exclude='citylab_venv' \
              --exclude='.git' \
              --exclude='.github' \
              "$GITHUB_WORKSPACE/" \
              /home/citylab/Desktop/Projects/CityLab_Security/

    - name: Install Dependencies
      run: |
        cd /home/citylab/Desktop/Projects/CityLab_Security

        set -euo pipefail
        python3.11 -m venv --system-site-packages citylab_venv

        source citylab_venv/bin/activate

        python -c "import sys; assert sys.version_info[:2] == (3, 11), 'Recrie citylab_venv com Python 3.11'"
        python -m pip install -r requirements-rpi-bookworm.txt
        python -c "import cv2; import mediapipe"
        python -m pip check

    # - name: Restart Application
    #   run: |
    #     sudo systemctl restart citylab.service
